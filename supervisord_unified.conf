# Configuration Supervisor pour Meta Publishing Platform - Mode Unifié
[program:unified_backend]
command=python start_unified_supervisor.py
directory=/app
autostart=true
autorestart=true
environment=APP_URL="https://senior-engineer-1.preview.emergentagent.com",INTEGRATION_PROXY_URL="https://integrations.emergentagent.com"
stderr_logfile=/var/log/supervisor/unified_backend.err.log
stdout_logfile=/var/log/supervisor/unified_backend.out.log
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

[program:mongodb]
command=/usr/bin/mongod --bind_ip_all
autostart=true
autorestart=true
stderr_logfile=/var/log/mongodb.err.log
stdout_logfile=/var/log/mongodb.out.log